name: JanNidhi Sentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-tests:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest Test Suite with Coverage Gate
        run: |
          pytest --cov=backend --cov=model --cov-report=term-missing --cov-fail-under=80 tests/

  frontend-build-and-lint:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

  docker-build-check:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    needs: [backend-quality-and-tests, frontend-build-and-lint]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: jannidhi-sentinel:ci-test
