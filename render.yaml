services:
  # ----------------------------------------------------------------------------
  # SERVICE 1: Main Public Web API & Dashboard Backend (100% FREE on Render)
  # ----------------------------------------------------------------------------
  - type: web
    name: jannidhi-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: mplads_sentinel
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_IN_PROCESS_SCHEDULER
        value: "0"
      - key: SEED_FROM_SAMPLE
        value: "1"

  # ----------------------------------------------------------------------------
  # NOTE: Render charges for native Cron Jobs ($1+/mo) & Workers ($7+/mo).
  # For 100% FREE automation:
  #   Use GitHub Actions (.github/workflows/scraper_cron.yml) which runs
  #   every 6 hours or on-demand with 7GB RAM and 2,000 free minutes/month!
  # If you have a paid Render plan and prefer native cron, uncomment below:
